[package]
name = "latch"
version = "0.1.0"
description = "A fast, keyboard-driven app launcher for macOS and Linux."
authors = ["Enes Durmus"]
license = "MIT"
repository = "https://github.com/enesdurmus/latch"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
arboard = "3.6.1"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Without this, arboard talks to XWayland instead of the Wayland clipboard, and
# a copy made in a native Wayland app is invisible to us.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
# GlobalShortcuts portal: the only way to get a global hotkey on a pure Wayland
# session, since tauri-plugin-global-shortcut's X11 key grabs don't reach a
# Wayland-native window (see docs/linux.md).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# titlebar_clicks_reach_the_buttons(): reaches into tao's GTK window
gtk = "0.18"
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSThread", "NSURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }

