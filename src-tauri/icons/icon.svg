<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A33"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#885CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#885CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8BFF"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="rimGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="272" y1="522" x2="840" y2="88">
      <stop offset="0" stop-color="#5EC8FF"/>
      <stop offset="0.5" stop-color="#8FA0FF"/>
      <stop offset="1" stop-color="#C9A8FF"/>
    </linearGradient>
    <linearGradient id="chevGloss" gradientUnits="userSpaceOnUse" x1="0" y1="88" x2="0" y2="522">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glyphGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <!-- glyph shapes, authored in glyph space -->
    <g id="shapes">
      <rect x="272" y="90" width="276" height="98" rx="46"/>
      <path d="M314 262H500A48 48 0 0 1 500 358H340Q296 358 272 376V304A42 42 0 0 1 314 262Z"/>
      <path d="M314 425H500A48.5 48.5 0 0 1 500 522H314A42 42 0 0 1 272 480V467A42 42 0 0 1 314 425Z"/>
      <path d="M638 136 792 305 638 474" fill="none" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- tile shadow -->
  <rect x="100" y="124" width="824" height="824" rx="185" fill="#000" opacity="0.55" filter="url(#tileShadow)"/>

  <!-- tile body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glowTR)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glowBL)"/>

  <!-- rim: glow, line, top gloss -->
  <g clip-path="url(#tileClip)">
    <rect x="112" y="112" width="800" height="800" rx="173" fill="none" stroke="url(#rim)" stroke-width="30" opacity="0.8" filter="url(#rimGlow)"/>
  </g>
  <rect x="110" y="110" width="804" height="804" rx="175" fill="none" stroke="url(#rim)" stroke-width="20"/>
  <rect x="110" y="110" width="804" height="804" rx="175" fill="none" stroke="url(#rimGloss)" stroke-width="20"/>
  <rect x="121" y="121" width="782" height="782" rx="164" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>

  <g transform="translate(512 512) scale(0.935) translate(-556 -305)">
    <!-- glyph glow + drop shadow -->
    <use href="#shapes" fill="#7C6CFF" stroke="#7C6CFF" opacity="0.55" filter="url(#glyphGlow)"/>
    <use href="#shapes" y="14" fill="#000" stroke="#000" opacity="0.5" filter="url(#glyphShadow)"/>
    <!-- glyph body -->
    <use href="#shapes" fill="url(#fg)" stroke="url(#fg)"/>
    <!-- glass highlight -->
    <g fill="url(#gloss)">
      <rect x="272" y="90" width="276" height="98" rx="46"/>
      <path d="M314 262H500A48 48 0 0 1 500 358H340Q296 358 272 376V304A42 42 0 0 1 314 262Z"/>
      <path d="M314 425H500A48.5 48.5 0 0 1 500 522H314A42 42 0 0 1 272 480V467A42 42 0 0 1 314 425Z"/>
    </g>
    <path d="M638 136 792 305 638 474" fill="none" stroke="url(#chevGloss)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
